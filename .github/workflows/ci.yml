name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # Mondays: new advisories and longer fuzzing
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the older run; runs on main
# always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: formatting and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable, components: rustfmt }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable, components: clippy }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Platform-specific code differs between Linux and macOS, so clippy runs
      # on every OS.
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  msrv:
    name: minimum Rust version (1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: ""   # an older compiler may not know newer lints
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: "1.88" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets --locked

  browser:
    name: browser extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: for f in browser/common/*.js; do node --check "$f"; done
      - run: node --test "browser/tests/*.test.js"

  scripts:
    name: shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: for f in installers/*.sh packaging/*.sh packaging/deb/*.sh browser/build.sh; do sh -n "$f"; done
      - run: shellcheck -s sh installers/*.sh packaging/make-dist.sh packaging/deb/build-deb.sh browser/build.sh

  packages:
    name: build .deb and .rpm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p fuck-ads-cli
      - name: Archive
        run: packaging/make-dist.sh x86_64-unknown-linux-gnu target/release/fuck-ads dist
      - name: Debian package
        run: packaging/deb/build-deb.sh target/release/fuck-ads 0.0.0-ci amd64 dist
      - name: RPM package
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          rpmbuild -bb packaging/rpm/fuck-ads.spec --define "_version 0.0.0" \
            --define "_srcroot $PWD" --define "_bin $PWD/target/release/fuck-ads" \
            --define "_rpmdir $PWD/dist"
          rpm -qpl dist/*/fuck-ads-*.rpm
          rpm -qpl dist/*/fuck-ads-*.rpm | grep -q '/usr/share/fuck-ads/chromium/manifest.json'
          rpm -qpl dist/*/fuck-ads-*.rpm | grep -q '/usr/share/fuck-ads/firefox/manifest.json'
          dpkg-deb -c dist/fuck-ads_0.0.0-ci_amd64.deb | grep -q 'usr/share/fuck-ads/chromium/manifest.json'
          rpm -qp --scripts dist/*/fuck-ads-*.rpm | grep -q systemctl

  linux-install:
    name: install + enable on a systemd host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install from source
        run: ./installers/install.sh
      - name: Verify
        run: |
          set -x
          fuck-ads status
          fuck-ads doctor || true
          # IPv4 only: `getent hosts` prefers IPv6 and would print `::` for a blocked name.
          getent ahostsv4 doubleclick.net | grep -q '0.0.0.0'
          getent ahostsv4 example.com
          getent ahostsv4 fuck-ads-probe.test | grep -q 127.0.0.209
          sudo fuck-ads allow doubleclick.net
          sudo resolvectl flush-caches || true
          ! getent ahostsv4 doubleclick.net | grep -q '0.0.0.0'
      - name: Daemon drops root after binding its sockets
        run: |
          set -x
          sudo systemctl stop fuck-ads
          sudo install -d -o fuck-ads -g fuck-ads /run/fuck-ads
          sudo sh -c "setsid $(command -v fuck-ads) daemon >/tmp/fuck-ads-root.log 2>&1 &"
          for i in $(seq 1 30); do [ -S /run/fuck-ads/control.sock ] && break; sleep 1; done
          PID=$(pgrep -x fuck-ads | head -1)
          test -n "$PID"
          test "$(ps -o user= -p "$PID" | tr -d ' ')" = fuck-ads
          getent ahostsv4 fuck-ads-probe.test | grep -q 127.0.0.209
          sudo kill "$PID"
          sleep 2
          sudo systemctl start fuck-ads
      - name: Disable restores DNS
        run: |
          sudo fuck-ads disable
          ! getent hosts fuck-ads-probe.test
          getent hosts example.com
      - name: Uninstall
        run: ./installers/uninstall.sh --purge && ! command -v fuck-ads

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: nightly }
      - run: cargo install cargo-fuzz --locked
      # Short smoke run on every change; ten minutes per target on the weekly schedule.
      - run: cd fuzz && cargo fuzz run parse_line -- -max_total_time=${{ github.event_name == 'schedule' && 600 || 120 }}
      - run: cd fuzz && cargo fuzz run engine -- -max_total_time=${{ github.event_name == 'schedule' && 600 || 120 }}

  audit:
    name: advisories (RustSec)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: licenses, bans, sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Needs the repository's "Dependency graph" switched on (Settings -> Code
      # security). Until it is, the action cannot run, so its failure is
      # reported but does not block the merge; remove `continue-on-error` once
      # the graph is enabled.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: high

  # One stable name to require in branch protection: it passes only if every
  # job above passed (skipped jobs are fine).
  ci-ok:
    name: CI passed
    if: always()
    needs: [fmt, test, msrv, browser, scripts, packages, linux-install, fuzz, audit, deny, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
