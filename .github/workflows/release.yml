name: Release

# Push a vX.Y.Z tag to publish a release. Running it by hand (workflow_dispatch)
# builds and tests everything but publishes nothing, as a dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: tag is on main, CI is green, version matches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read           # read the "CI passed" result of the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0      # the whole history, to see whether the tag is on main
          persist-credentials: false
      - name: The tagged commit is on main and passed CI
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Merge it into main first, then tag the merge commit."
            exit 1
          fi
          RESULT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI passed")] | sort_by(.started_at) | last | .conclusion // "missing"')"
          if [ "$RESULT" != "success" ]; then
            echo "::error::The 'CI passed' check is '$RESULT' on $GITHUB_SHA. Wait for green CI on main before tagging."
            exit 1
          fi
      - name: Compare the tag with the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag $TAG does not match the Cargo.toml version $CARGO_VERSION"; exit 1
          fi
          # Browser manifests only allow numeric versions (no -rc suffix).
          NUMERIC="${CARGO_VERSION%%-*}"
          for m in browser/chromium/manifest.json browser/firefox/manifest.json; do
            grep -q "\"version\": \"$NUMERIC\"" "$m" || { echo "::error::$m does not have version $NUMERIC"; exit 1; }
          done
          grep -q "^pkgver=${NUMERIC}$" packaging/arch/PKGBUILD || { echo "::error::packaging/arch/PKGBUILD pkgver is not $NUMERIC"; exit 1; }

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu,  deb: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, deb: arm64 }
          # The Intel build is cross-compiled on Apple silicon; its tests run
          # natively in the aarch64 job.
          - { os: macos-14,         target: x86_64-apple-darwin, cross: true }
          - { os: macos-14,         target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo test --workspace --locked
        if: ${{ !matrix.cross }}
      - run: cargo build --release --locked -p fuck-ads-cli --target ${{ matrix.target }}
      - name: Archive
        run: packaging/make-dist.sh ${{ matrix.target }} target/${{ matrix.target }}/release/fuck-ads dist
      - name: Debian package
        if: matrix.deb
        run: packaging/deb/build-deb.sh target/${{ matrix.target }}/release/fuck-ads "${GITHUB_REF_NAME#v}" ${{ matrix.deb }} dist
      - name: RPM package
        if: matrix.deb
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          rpmbuild -bb packaging/rpm/fuck-ads.spec --define "_version ${GITHUB_REF_NAME#v}" \
            --define "_srcroot $PWD" --define "_bin $PWD/target/${{ matrix.target }}/release/fuck-ads" \
            --define "_rpmdir $PWD/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/**
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Browser extensions
        run: |
          ./browser/build.sh
          cp browser/dist/fuck-ads-chromium.zip browser/dist/fuck-ads-firefox.zip dist/
      - name: Checksums
        run: cd dist && find . -type f ! -name '*.sha256' -exec sha256sum {} + > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/**
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          mapfile -d '' FILES < <(find dist -type f -print0)
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" $PRERELEASE \
            "${FILES[@]}" installers/install.sh installers/install-macos.sh installers/uninstall.sh

  homebrew:
    name: update the Homebrew tap
    needs: publish
    # Stable releases only (no -rc/-beta tags).
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Bump url and sha256 in the tap formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::TAP_GITHUB_TOKEN is not set, so the Homebrew tap was not updated (see docs/development.md)"
            exit 0
          fi
          URL="https://github.com/$REPO/archive/refs/tags/$TAG.tar.gz"
          SHA="$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)"
          [ -n "$SHA" ] || { echo "::error::could not download $URL"; exit 1; }
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/$OWNER/homebrew-tap.git" tap
          cd tap
          sed -i -E "s|^(  url \").*(\")|\1$URL\2|; s|^(  sha256 \").*(\")|\1$SHA\2|" Formula/fuck-ads.rb
          git diff --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "fuck-ads $TAG"
          git push origin HEAD:main
